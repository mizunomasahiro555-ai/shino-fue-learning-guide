<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f0"><meta name="description" content="篠笛の口伝と譜面、それぞれの学び方を短いフレーズで比べる無料体験。"><title>口伝と譜面、学び方を比べる｜篠笛の無料体験</title>
<style>
:root{--ink:#202b26;--muted:#68736c;--paper:#f6f5f0;--card:#fffefa;--green:#285b48;--green2:#e8f0e9;--line:#d9ded5;--orange:#bd633c;--serif:"Yu Mincho","Hiragino Mincho ProN",serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;font-size:16px;line-height:1.75}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #d38146;outline-offset:3px}.shell{min-height:100svh;display:flex;flex-direction:column}.top{width:min(100% - 40px,760px);margin:0 auto;padding:22px 0 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;font-weight:700;letter-spacing:.08em}.privacy{font-size:12px;color:var(--muted)}main{width:min(100% - 32px,680px);margin:0 auto;flex:1;padding:26px 0 52px}.progress-wrap{margin:0 auto 22px;width:min(100%,560px)}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.track{height:5px;border-radius:9px;background:#e3e5dd;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .25s}.card{background:var(--card);border:1px solid #e8e8df;border-radius:22px;padding:clamp(24px,6vw,52px);box-shadow:0 12px 40px #2433240a}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:750}.hero-title{font-family:var(--serif);font-size:clamp(32px,7vw,52px);line-height:1.35;letter-spacing:.02em;margin:18px 0}.hero-title span{color:var(--green)}h1{font-size:clamp(25px,5vw,34px);line-height:1.45;margin:10px 0 18px;font-family:var(--serif);font-weight:650}h2{font-family:var(--serif);font-size:21px;line-height:1.5;margin:28px 0 10px}.lead{font-size:17px;color:#45524a}.muted{color:var(--muted)}.small{font-size:13px}.hero-art{margin:26px 0 18px;border-radius:16px;background:#e9eee6;padding:21px 18px;display:flex;align-items:center;justify-content:center;gap:16px;color:var(--green);font-family:var(--serif);font-size:20px}.hero-art .versus{color:#939a90;font-family:system-ui;font-size:12px}.notice{background:#f2f2eb;border-left:3px solid #9aa58f;padding:12px 15px;border-radius:0 10px 10px 0;font-size:13px;color:#4d5850;margin:18px 0}.actions{display:flex;gap:12px;justify-content:space-between;margin-top:28px}.btn{min-height:52px;border-radius:12px;padding:12px 20px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.btn.primary{background:var(--green);color:white;border-color:var(--green);flex:1}.btn.primary:hover{background:#204a3a}.btn.secondary:hover,.option:hover{background:#f0f3ec}.btn:disabled{opacity:.45;cursor:not-allowed}.options{display:grid;gap:10px;margin-top:24px}.option{display:flex;align-items:center;gap:13px;min-height:58px;padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:var(--card);text-align:left;cursor:pointer;color:var(--ink)}.option[aria-pressed="true"]{border:2px solid var(--green);background:var(--green2);padding:13px 15px}.radio{height:19px;width:19px;border:1.5px solid #9ba49c;border-radius:50%;flex:none;display:grid;place-items:center}.option[aria-pressed="true"] .radio:after{content:"";height:9px;width:9px;border-radius:50%;background:var(--green)}.step-label{display:inline-flex;gap:8px;align-items:center;color:var(--green);font-size:13px;font-weight:700}.step-no{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--green2)}.score-list{display:grid;gap:17px;margin:20px 0}.score-row{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:13px}.score-track{height:12px;background:#edf0e9;border-radius:20px;overflow:hidden}.score-bar{height:100%;border-radius:20px;background:var(--green)}.score-bar.alt{background:#c27650}.result-callout{background:var(--green2);border-radius:16px;padding:20px;margin:20px 0}.result-callout h2{margin:0 0 8px;color:var(--green)}.tip{border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0;background:#fff}.tag{display:inline-block;border-radius:99px;padding:4px 10px;background:#f0eee4;color:#575849;font-size:12px;font-weight:700}.divider{border:0;border-top:1px solid var(--line);margin:24px 0}.foot{width:min(100% - 40px,760px);margin:0 auto;padding:0 0 22px;color:#81877f;font-size:11px;display:flex;justify-content:space-between}.linkbtn{color:var(--green);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:8px 0;cursor:pointer;font-weight:650}.note-box{padding:16px;background:#f2f2eb;border-radius:12px;margin-top:18px}.sequence{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.sequence span{background:white;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-family:var(--serif);font-weight:700}.optional{border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}.optional h2{margin-top:0}.pill{font-size:11px;color:#646c64;background:#f0f0e9;border-radius:99px;padding:4px 9px}.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:520px){.top{width:calc(100% - 32px);padding-top:16px}.privacy{font-size:11px}.card{border-radius:18px;padding:25px 21px}.hero-art{gap:10px;font-size:17px}.actions{gap:8px}.btn{padding:11px 14px}.score-row{grid-template-columns:82px 1fr 28px;gap:7px;font-size:12px}.foot{width:calc(100% - 32px)}main{padding-top:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><div class="shell"><header class="top"><div class="brand">篠笛の学び方ノート</div><div class="privacy">回答はこの端末内に保存</div></header><main id="app" aria-live="polite"></main><footer class="foot"><span>篠笛の練習方法を考える無料体験</span><span>入力内容は外部送信されません</span></footer></div>
<script>
(()=>{'use strict';const KEY='shino-learning-simulator-v1';const app=document.getElementById('app');const questions=[
{id:'method',q:'今の篠笛の学び方に近いものはどれですか？',hint:'今の状況に合わせて、結果の読み方を整えます。',opts:['口伝を中心に学んでいる','譜面も使って学んでいる','独学している','まだ決めていない']},
{id:'genre',q:'どのような曲を学びたいですか？',hint:'目標にしている曲のジャンルを選んでください。',opts:['祭囃子','神楽','その他']},
{id:'repertoire',q:'これから覚えたい曲の数はどれくらいですか？',hint:'曲数に応じて、記録や見返しのヒントを調整します。',opts:['まずは1曲','数曲','多くの曲・レパートリー']},
{id:'days',q:'1週間に何日くらい練習できそうですか？',hint:'練習間隔の目安です。上達時間の予測には使いません。',opts:['1日','2〜3日','4日以上','週によって変わる']},
{id:'oral_repeat',q:'口伝で短いフレーズを覚えるなら、何回くらい聞き直したり確認したりしそうですか？',hint:'教わる人に聞き返す、音をもう一度聞く場面を想像してください。',opts:['ほとんど必要なさそう','1〜2回','3〜5回','6回以上','見当がつかない'],scale:[0,1,2,3,null]},
{id:'oral_review',q:'口伝で覚えたフレーズを、次の練習までに思い出すにはどのくらい復習が必要そうですか？',hint:'ご自身の感覚で選んでください。正解はありません。',opts:['その場で覚えられそう','練習のたびに少し確認','毎回かなり聞き直す・確認する','見当がつかない'],scale:[0,1,2,null]},
{id:'notation_read',q:'数字符で同じフレーズを覚えるなら、読み方や運指を何回くらい確認しそうですか？',hint:'数字符が初めてなら「見当がつかない」を選べます。',opts:['ほとんど必要なさそう','1〜2回','3〜5回','6回以上','見当がつかない'],scale:[0,1,2,3,null]},
{id:'notation_review',q:'譜面を見ずに吹くとき、運指や曲の流れを思い出すためにどのくらい確認が必要そうですか？',hint:'譜面の確認と、音や演奏を身につける練習は別の作業です。',opts:['少し見返せばよさそう','練習のたびに何度か見返す','譜面を見ながら練習する期間が必要そう','見当がつかない'],scale:[0,1,2,null]},
{id:'record',q:'覚えた内容を後日確認するとき、どの方法が自分にとって確かめやすそうですか？',hint:'複数の方法を組み合わせてもかまいません。',opts:['教わった人にもう一度聞く','譜面を見返す','音源や録音も使いたい','方法を組み合わせたい','まだ分からない']},
{id:'priority',q:'今回の比較で、特に整理したいことはどれですか？',hint:'結果画面の「次の一歩」を選ぶ参考にします。',opts:['まず音を聞いて曲の雰囲気をつかみたい','数字符と運指を理解したい','覚えた内容をあとで確認できるようにしたい','教室や先生の選び方を考えたい']}
];let state=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||{page:'home',idx:0,answers:{},demo:0}}catch{return{page:'home',idx:0,answers:{},demo:0}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function progress(){let pct=state.page==='home'?0:state.page==='result'||state.page==='offer'||state.page==='done'?100:Math.round(((state.idx+1)/questions.length)*88);return `<div class="progress-wrap" aria-label="進行状況"><div class="progress-meta"><span>${state.page==='home'?'無料体験':`質問 ${Math.min(state.idx+1,questions.length)} / ${questions.length}`}</span><span>${pct?`${pct}%`:''}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`}function render(){save();if(state.page==='home')home();else if(state.page==='question')question();else if(state.page==='demo')demo();else if(state.page==='result')result();else if(state.page==='offer')offer();else done();window.scrollTo({top:0,behavior:'smooth'})}function frame(body,prog=true){app.innerHTML=(prog?progress():'')+`<section class="card">${body}</section>`}function home(){frame(`<div class="eyebrow">約10分の無料体験</div><h1 class="hero-title">口伝と譜面、<br><span>学び方を比べる</span></h1><p class="lead">同じ短いフレーズを題材に、覚える手順と確認の手間をたどってみましょう。</p><div class="hero-art"><span>耳で聞く</span><span class="versus">と</span><span>数字符で読む</span></div><p>口伝には、人から音や間合いを学ぶ良さがあります。譜面には、運指や曲の流れを記録して見返せる良さがあります。どちらかを正解と決めず、あなたの練習に合う使い方を考える体験です。</p><div class="notice">回答はこのブラウザー内に保存され、外部には送信されません。比較はあなた自身の見積もりに基づく目安で、一般統計や習得時間の予測ではありません。</div><div class="actions"><button class="btn primary" id="start">無料体験を始める <span aria-hidden="true">→</span></button></div>`,false);document.getElementById('start').onclick=()=>{state.page='question';state.idx=0;render()}}function question(){const q=questions[state.idx],selected=state.answers[q.id];frame(`<div class="eyebrow">あなたの練習について</div><h1>${esc(q.q)}</h1><p class="muted">${esc(q.hint)}</p><div class="options" role="group" aria-label="選択肢">${q.opts.map((o,i)=>`<button class="option" data-i="${i}" aria-pressed="${selected===o}"><span class="radio" aria-hidden="true"></span><span>${esc(o)}</span></button>`).join('')}</div><div class="actions"><button class="btn secondary" id="back">戻る</button><button class="btn primary" id="next" ${selected?'':'disabled'}>${state.idx===questions.length-1?'疑似体験へ':'次へ'}</button></div><p class="screen-reader" id="status" aria-live="polite"></p>`);app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.answers[q.id]=q.opts[+b.dataset.i];app.querySelectorAll('.option').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.getElementById('next').disabled=false;save()});document.getElementById('back').onclick=()=>{if(state.idx>0){state.idx--;render()}else{state.page='home';render()}};document.getElementById('next').onclick=()=>{if(!state.answers[q.id])return;if(state.idx<questions.length-1){state.idx++;render()}else{state.page='demo';state.demo=0;render()}}}const demos=[{kind:'口伝の疑似体験',title:'まず、音を聞く',copy:'教わる人の音を聞き、音の高さや間合い、フレーズのまとまりをつかみます。分からないところは、その場で何度でも聞き直せます。',chip:'聞く'},{kind:'口伝の疑似体験',title:'短くまねてみる',copy:'一度に全部を覚えようとせず、短いまとまりごとにまねます。息の使い方や音色は、実際の音を聞きながら確かめていきます。',chip:'まねる'},{kind:'口伝の疑似体験',title:'分からない箇所を聞き返す',copy:'音の高さ、指の動き、入るタイミングなど、迷った点を教わる人に確認します。地域や流派ならではの教え方も大切な手がかりです。',chip:'聞き返す'},{kind:'口伝の疑似体験',title:'次の練習で思い出す',copy:'次に練習するとき、音や運指を思い出して吹いてみます。必要なら、もう一度教わった人に聞く、または自分用のメモを残す方法もあります。',chip:'思い出す'},{kind:'数字符の疑似体験',title:'数字を読む',copy:'数字符は、篠笛の音や運指を数字などで表す譜面の一つです。ここでは説明用のオリジナル例を使います。流派・地域によって表記や読み方が異なる場合があります。',chip:'読む',notation:true},{kind:'数字符の疑似体験',title:'運指を確かめる',copy:'数字を一つずつ指の動きと対応させます。例の運指は説明用の模式例です。実際の篠笛や譜面では、使う笛・流派の指導に沿って確認してください。',chip:'運指'},{kind:'数字符の疑似体験',title:'音を出して確かめる',copy:'譜面は音や曲の流れを確認する手がかりです。音色、息づかい、間合いは、吹いてみたり指導者や音源に確かめたりする練習が必要です。',chip:'確かめる'},{kind:'数字符の疑似体験',title:'次の練習で見返す',copy:'次の練習で譜面を見返せば、どの数字や運指を確認するかを思い出せます。譜面があることで、練習内容を書き留めやすくなる場合があります。',chip:'見返す'}];function demo(){const d=demos[state.demo];frame(`<div class="eyebrow">${d.kind} · ${state.demo%4+1} / 4</div><div class="step-label"><span class="step-no">${state.demo<4?'耳':'譜'}</span>${d.chip}</div><h1>${d.title}</h1><p class="lead">${d.copy}</p>${d.notation?`<div class="sequence" aria-label="説明用の短い数字符の例"><span>1</span><span>2</span><span>3</span><span>2</span><span>1</span></div><p class="small muted">例：1・2・3・2・1（説明用の符号列。特定の曲の音や運指を示すものではありません）</p>`:''}<div class="notice">実際の音源は再生していません。この画面では学習の手順を文章で確認します。</div><div class="actions"><button class="btn secondary" id="back">戻る</button><button class="btn primary" id="next">${state.demo===demos.length-1?'結果を見る':'次の手順'}</button></div>`);document.getElementById('back').onclick=()=>{if(state.demo>0){state.demo--;render()}else{state.page='question';state.idx=questions.length-1;render()}};document.getElementById('next').onclick=()=>{if(state.demo<demos.length-1){state.demo++;render()}else{state.page='result';render()}}}function scores(){const specs=[['聞き直し・確認','oral_repeat','notation_read',4,6],['次回の復習','oral_review','notation_review',5,7]];return specs.map(([label,oralId,notationId,oralQ,notationQ])=>{const oq=questions[oralQ],nq=questions[notationQ],oi=oq.opts.indexOf(state.answers[oralId]),ni=nq.opts.indexOf(state.answers[notationId]);return{label,oral:oi<0?null:oq.scale[oi]??null,notation:ni<0?null:nq.scale[ni]??null}})}function getType(){const a=state.answers,s=scores(),valid=s.filter(x=>x.oral!==null&&x.notation!==null);if(a.method==='まだ決めていない'||valid.length===0)return 3;if(a.record==='音源や録音も使いたい'||a.record==='方法を組み合わせたい')return 2;if(a.priority==='数字符と運指を理解したい'||a.repertoire!=='まずは1曲'&&a.record==='譜面を見返す')return 1;return 0}const types=[['まずは口伝で音をつかみ、譜面で確かめる','音や間合いを人から学ぶ良さを生かしながら、運指や曲の区切りは譜面やメモで確かめる方法が候補です。'],['数字符と運指から曲の見通しをつくる','曲の流れや運指を記録して見返したい方には、数字符を補助に使う方法が候補です。音色や間合い、演奏技術は別に練習します。'],['音源・譜面・人の確認を組み合わせる','音で確かめる、譜面で運指を見る、指導者に質問する方法を組み合わせられます。それぞれ異なる役割を生かす選択です。'],['まずは学び方を一度試してから決める','まだ手間を比較できなくても大丈夫です。短いフレーズで両方の手順を試し、自分が確認しやすい方法を見つける段階です。']];function result(){const s=scores(),valid=s.filter(x=>x.oral!==null&&x.notation!==null),idx=getType(),t=types[idx],answers=state.answers;const chart=valid.length===2?`<p class="small">作業項目ごとの、あなた自身の見積もり（0〜3段階）</p><div class="score-list">${s.map(x=>`<div><div class="score-row"><span>${x.label}</span><div class="score-track" role="img" aria-label="${x.label}：口伝 ${x.oral===null?'未見積もり':x.oral+'段階'}、譜面 ${x.notation===null?'未見積もり':x.notation+'段階'}"><div class="score-bar" style="width:${(x.oral/3)*100}%"></div></div><span>口伝</span></div><div class="score-row"><span></span><div class="score-track" aria-hidden="true"><div class="score-bar alt" style="width:${(x.notation/3)*100}%"></div></div><span>譜面</span></div></div>`).join('')}</div><div class="small"><span class="tag">緑：口伝</span> <span class="tag">茶：譜面</span></div><p class="small muted">0〜3段階は選択肢の順序を示す表示用の目盛りです。実時間や統計的な差ではありません。</p>`:`<div class="notice">比較図は表示していません。${s.filter(x=>x.oral===null||x.notation===null).map(x=>x.label).join('、')||'比較項目'}に見積もりのない回答があるため、手順の違いを参考にしてください。見積もりのない項目をゼロとして扱っていません。</div>`;let first=idx===0?'教わった短いフレーズを一つ選び、聞いた音と運指を自分が後で見返せる形で記録する。':idx===1?'短いフレーズの数字符を一つ選び、吹く前に数字と指の動きの対応を指導内容に沿って確認する。':idx===2?'次の練習で確かめたいことを一つ選び、音・譜面・指導者のどれで確認するか決める。':'短いフレーズを一つ選び、口伝で聞く方法と数字符で読む方法をそれぞれ一度試す。';if(answers.priority==='教室や先生の選び方を考えたい')first='質問できる機会、地域や流派への理解、篠笛の基礎をどう教えるかを確認して、相談先を一つ検討する。';frame(`<div class="eyebrow">あなたの比較メモ</div><h1>学び方の手順を整理しました</h1><div class="notice">あなた自身の見積もりに基づく目安であり、一般統計ではありません。習得時間や上達速度を予測するものではありません。</div>${chart}<div class="result-callout"><span class="tag">あなたへの提案</span><h2>${t[0]}</h2><p>${t[1]}</p></div><h2>それぞれが役立つ場面</h2><div class="tip"><strong>口伝</strong><br><span class="muted">人から音、間合い、地域や流派の伝承を学ぶ。分からない点をその場で確かめる。</span></div><div class="tip"><strong>譜面・数字符</strong><br><span class="muted">数字や運指、曲の流れを記録して見返す。譜面だけで音色や演奏技術のすべてが身につくわけではありません。</span></div><div class="result-callout"><span class="tag">次の練習で試すこと</span><p><strong>${first}</strong></p></div><p class="small muted">学びたい曲：${esc(answers.genre||'未回答')} ／ 目標：${esc(answers.repertoire||'未回答')} ／ 練習日数：${esc(answers.days||'未回答')}</p><div class="actions"><button class="btn secondary" id="edit">回答を見直す</button><button class="btn primary" id="offer">講座案内を見る（任意）</button></div><div class="actions"><button class="linkbtn" id="copy">結果をコピー</button><button class="linkbtn" id="print">印刷する</button></div><p class="small muted" id="copymsg" aria-live="polite"></p>`);document.getElementById('edit').onclick=()=>{state.page='question';state.idx=0;render()};document.getElementById('offer').onclick=()=>{state.page='offer';render()};document.getElementById('print').onclick=()=>window.print();document.getElementById('copy').onclick=async()=>{const txt=`口伝 vs 譜面 学習手順シミュレーター\n${t[0]}\n${t[1]}\n次の一歩：${first}\nあなた自身の見積もりに基づく目安であり、一般統計ではありません。`;try{await navigator.clipboard.writeText(txt);document.getElementById('copymsg').textContent='結果をコピーしました。'}catch{document.getElementById('copymsg').textContent='このブラウザーではコピーできません。印刷機能をご利用ください。'}}}function offer(){frame(`<div class="eyebrow">任意のご案内 · 有料講座</div><h1>数字符と篠笛の基礎を学びたい方へ</h1><p class="lead">「超速習！3ヶ月で学ぶ 篠笛演奏の基本技術と基礎知識」</p><p>無料体験で整理できるのは、口伝と譜面の学び方の違いと、次の練習行動です。この講座は別の有料商品で、篠笛演奏の基本技術と基礎知識を学ぶ内容です。</p><div class="notice">料金、日程、受講形式、申込方法などの詳細は、このページでは確認できていません。事実に基づく講座案内をご用意できるまで、申込リンクや未確認情報は表示していません。</div><p>口伝や地域の指導を大切にしたい方は、それらと講座を併用する方法もご検討ください。案内を見るかどうかは自由です。</p><div class="actions"><button class="btn secondary" id="back">結果に戻る</button><button class="btn primary" id="done">体験を終える</button></div>`,`true`);document.getElementById('back').onclick=()=>{state.page='result';render()};document.getElementById('done').onclick=()=>{state.page='done';render()}}function done(){frame(`<div class="eyebrow">体験完了</div><h1>自分に合う一歩から</h1><p class="lead">比べた結果は、これからの練習を考えるためのメモです。次の練習で小さく試してみてください。</p><div class="actions"><button class="btn secondary" id="again">最初からやり直す</button><button class="btn primary" id="result">結果に戻る</button></div>`,`false`);document.getElementById('again').onclick=()=>{state={page:'home',idx:0,answers:{},demo:0};save();render()};document.getElementById('result').onclick=()=>{state.page='result';render()}}render()})();
</script></body></html>
